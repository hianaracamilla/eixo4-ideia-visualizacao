<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apresentação: Os 5 Sub-eixos do Eixo 4 · Soberania Digital Popular</title>
  <meta name="description" content="Apresentação oficial da estrutura operacional do Eixo 4: Linhas, sub-eixos, fluxo de trabalho e incidência no Estado.">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    /* Estilos específicos para a Apresentação de Slides */
    body {
      background-color: var(--branco-papel);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .deck-topbar {
      background-color: var(--preto-tinta);
      color: var(--branco-papel);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: var(--border-thick);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .deck-topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-voltar {
      background-color: var(--amarelo-sol);
      color: var(--preto-tinta);
      border: var(--border-medium);
      padding: 6px 14px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 2px 0px var(--branco-papel);
      transition: transform var(--trans-fast);
    }

    .btn-voltar:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--branco-papel);
    }

    .deck-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 40px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    /* O Slide (Prancha Neobrutalista) */
    .slide-stage {
      width: 100%;
      background-color: var(--branco-puro);
      border: var(--border-thick);
      box-shadow: 8px 8px 0px var(--preto-tinta);
      min-height: 560px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }

    .slide-stage::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: repeating-linear-gradient(
        45deg,
        var(--azul-macacao),
        var(--azul-macacao) 14px,
        var(--amarelo-sol) 14px,
        var(--amarelo-sol) 28px
      );
    }

    .slide-content {
      padding: 40px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .slide-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--azul-macacao);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: 2.3rem;
      font-weight: 900;
      line-height: 1.15;
      text-transform: uppercase;
      color: var(--preto-tinta);
      margin-top: 6px;
    }

    .slide-subtitle {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--vermelho-ato);
      margin-top: 4px;
    }

    .slide-body {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #2b312e;
    }

    /* Rodapé do Slide */
    .slide-footer-bar {
      border-top: var(--border-medium);
      background-color: var(--areia);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Barra de Navegação Inferior */
    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background-color: var(--azul-macacao);
      color: var(--branco-papel);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      padding: 10px 22px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all var(--trans-fast);
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--preto-tinta);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hard-lg);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .slide-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot-btn {
      width: 32px;
      height: 32px;
      border: var(--border-medium);
      background-color: var(--branco-papel);
      color: var(--preto-tinta);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0px var(--preto-tinta);
      transition: all var(--trans-fast);
    }

    .dot-btn.active {
      background-color: var(--amarelo-sol);
      color: var(--preto-tinta);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--preto-tinta);
      font-weight: 900;
    }

    /* Grids e Elementos Internos dos Slides */
    .subeixo-split {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: start;
      margin-top: 16px;
    }

    @media (max-width: 860px) {
      .subeixo-split {
        grid-template-columns: 1fr;
      }
      .slide-title {
        font-size: 1.7rem;
      }
      .slide-content {
        padding: 24px;
      }
    }

    .box-fluxo {
      background-color: #FFF;
      border: var(--border-medium);
      padding: 16px 20px;
    }

    .box-fluxo.recebe {
      border-left: 8px solid var(--azul-macacao);
    }

    .box-fluxo.entrega {
      border-left: 8px solid var(--verde-pilar);
    }

    .box-fluxo.regra {
      border-left: 8px solid var(--vermelho-ato);
      background-color: #FFF2F1;
    }

    .fluxo-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .grid-3-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 16px;
    }

    @media (max-width: 768px) {
      .grid-3-col {
        grid-template-columns: 1fr;
      }
    }

    .card-destaque {
      background: #FFF;
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>

    const Apresentacao = (() => {
      let currentSlide = 0;

      function renderSlide(index) {
        if (index < 0 || index >= SLIDES_DATA.length) return;
        currentSlide = index;

        const data = SLIDES_DATA[index];
        const stage = document.getElementById("slideStage");

        stage.style.opacity = "0.4";
        setTimeout(() => {
          stage.innerHTML = `
            <div class="slide-content">
              <div>
                <div class="slide-eyebrow">
                  <span>${data.eyebrow}</span>
                </div>
                <h2 class="slide-title">${data.titulo}</h2>
                <div class="slide-subtitle">${data.subtitulo}</div>
              </div>

              <div class="slide-inner">
                ${data.render()}
              </div>
            </div>

            <div class="slide-footer-bar">
              <span>${data.rodape}</span>
              <span>SLIDE ${index + 1} / ${SLIDES_DATA.length}</span>
            </div>
          `;
          stage.style.opacity = "1";
        }, 100);

        // Atualizar indicadores
        document.getElementById("currentSlideNum").textContent = index + 1;
        document.getElementById("totalSlidesNum").textContent = SLIDES_DATA.length;

        document.getElementById("prevBtn").disabled = index === 0;
        document.getElementById("nextBtn").disabled = index === SLIDES_DATA.length - 1;

        // Atualizar Dots
        const dotsContainer = document.getElementById("slideDots");
        dotsContainer.innerHTML = SLIDES_DATA.map((_, i) => `
          <button class="dot-btn ${i === index ? 'active' : ''}" onclick="Apresentacao.goTo(${i})" title="Ir para o slide ${i + 1}">
            ${i + 1}
          </button>
        `).join("");

        window.location.hash = `slide-${index + 1}`;
      }

      function next() {
        if (currentSlide < SLIDES_DATA.length - 1) {
          renderSlide(currentSlide + 1);
        }
      }

      function prev() {
        if (currentSlide > 0) {
          renderSlide(currentSlide - 1);
        }
      }

      function goTo(index) {
        renderSlide(index);
      }

      function init() {
        // Suporte ao teclado (setas direita e esquerda)
        window.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
            next();
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            prev();
          }
        });

        // Hash inicial
        const hashMatch = window.location.hash.match(/slide-(\d+)/);
        const initialIndex = hashMatch ? parseInt(hashMatch[1], 10) - 1 : 0;
        renderSlide(initialIndex >= 0 && initialIndex < SLIDES_DATA.length ? initialIndex : 0);
      }

      return {
        init,
        next,
        prev,
        goTo
      };
    })();

    document.addEventListener("DOMContentLoaded", () => {
      Apresentacao.init();
    });
  </script>
